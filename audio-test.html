<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水豚温泉町 音频试听</title>
<style>
  body{margin:0; padding:20px 16px 40px; background:linear-gradient(180deg,#C7E39A,#9BCB6C);
    font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif; color:#6B4F3A;}
  .wrap{max-width:520px; margin:0 auto;}
  h1{font-size:20px; letter-spacing:2px; margin:0 0 4px;}
  .sub{font-size:12.5px; color:#5C6B45; margin-bottom:18px;}
  .card{background:linear-gradient(180deg,#FFFDF6,#F7ECD5); border:2.5px solid #E8D6B2;
    border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 10px rgba(90,120,60,.2);}
  .card h2{font-size:15px; margin:0 0 2px;}
  .card p{font-size:12px; color:#A18A68; margin:0 0 10px; line-height:1.6;}
  audio{width:100%; height:44px;}
  .tag{display:inline-block; font-size:10.5px; font-weight:900; color:#FFF6E8;
    background:#F0913C; border-radius:999px; padding:2px 10px; margin-bottom:6px;}
  .tag.music{background:#7FB84F;}
  .note{background:rgba(255,253,246,.75); border:2px dashed #E8D6B2; border-radius:14px;
    padding:12px 14px; font-size:12px; line-height:1.7; color:#7A5A36;}
  .note b{color:#D4762A;}
</style>
</head>
<body>
<div class="wrap">
  <h1>水豚温泉町 音频试听</h1>
  <div class="sub">配音已定（甜美精品音）· 现在只需选背景音乐：听完告诉我「音乐 1」或「音乐 2」</div>

  <div class="card">
    <span class="tag">配音（已选定）</span>
    <h2>甜美精品音</h2>
    <p>台词：呼……走了好远的路，这里就是外婆信里写的那间店吧。</p>
    <audio controls preload="none" src="audio/voice/intro_2.mp3"></audio>
  </div>



  <div class="card">
    <span class="tag music">音乐 1（新）</span>
    <h2>轻柔钢琴（2 分 57 秒）</h2>
    <p>钢琴 + 柔和弦乐，70 BPM。已排除沙锤、风铃等全部碎响打击乐</p>
    <audio controls preload="none" src="audio/bgm_piano.mp3"></audio>
  </div>

  <div class="card">
    <span class="tag music">音乐 2（新）</span>
    <h2>铃音木琴（1 分 48 秒）</h2>
    <p>颤音琴 + 钟琴 + 尼龙吉他，84 BPM。更轻快一点，同样无碎响</p>
    <audio controls preload="none" src="audio/bgm_bell.mp3"></audio>
  </div>

  <div class="note">
    上次三首里的"沙沙声"是沙锤/风铃类碎响打击乐，这两首生成时已全部排除。<br>
    <b>选 1 或 2</b>，定了我就接进游戏做循环播放，并把剩余剧情配音补全。
  </div>
</div>
</body>
</html>
